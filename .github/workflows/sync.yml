name: sync

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 05:17 UTC — refresh versions, repo health and the catalog.
    - cron: '17 5 * * 1'
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scheduled and manual runs refresh the generated files and commit them.
  # Pushes are NOT refreshed here: a person pushing already owns the commit.
  refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync against the live index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync.mjs
      - name: Commit refreshed data
        run: |
          if git diff --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh catalog and verified versions"
          git push

  # Every pull request, and every hand push to main, must leave the repository
  # consistent with plugins.json and every pick still installable.
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Checked BEFORE the sync, so it inspects the files as committed.
      - name: README matches plugins.json
        run: node scripts/check-readme.mjs
      - name: Every pick still resolves in the index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync.mjs
